version: 2
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/s3lock
    ldflags:
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
checksum:
  name_template: "checksums.txt"
homebrew_casks:
  - repository:
      owner: winebarrel
      name: homebrew-s3lock
    homepage: https://github.com/winebarrel/s3lock
    description: s3lock is a locking command using S3.
    license: MIT
    # Homebrew 7 deprecates the postflight block that hooks.post.install
    # renders, so emit postflight_steps via custom_block instead. goreleaser
    # templates the whole cask, so {{staged_path}} is written as a template
    # producing that literal, expanded by Homebrew at install time. Move this
    # to the dedicated goreleaser field once it ships (goreleaser#6870).
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/s3lock"]
        end
      end
nfpms:
  - file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/winebarrel/s3lock
    description: s3lock is a locking command using S3.
    license: MIT
    maintainer: "Genki Sugawara <sugawara@winebarrel.jp>"
    formats:
      - apk
      - deb
      - rpm
